<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Liên kết không còn hoạt động · URL Shortener</title>
    <link rel="stylesheet" th:href="@{/redirect/redirect.css}" href="/redirect/redirect.css">
</head>
<body>
<main class="page-shell">
    <section class="card" aria-labelledby="page-title">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
            </span>
            URL Shortener
        </div>
        <div class="status-icon status-icon--danger" aria-hidden="true">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
            </svg>
        </div>
        <h1 id="page-title">Liên kết không còn hoạt động</h1>
        <p class="description">
            Liên kết<span th:if="${linkTitle != null and !#strings.isEmpty(linkTitle)}"> <span class="link-title" th:text="${linkTitle}">này</span></span> đã hết hạn hoặc đã được chủ sở hữu ngừng kích hoạt.
        </p>
        <p class="footer-note">Hãy liên hệ người đã chia sẻ liên kết nếu bạn cho rằng đây là nhầm lẫn.</p>
    </section>
</main>
</body>
</html>
