<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mở khóa liên kết · URL Shortener</title>
    <link rel="stylesheet" th:href="@{/redirect/redirect.css}" href="/redirect/redirect.css">
</head>
<body>
<main class="page-shell">
    <section class="card" aria-labelledby="page-title">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
            </span>
            URL Shortener
        </div>

        <div class="status-icon" aria-hidden="true">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <h1 id="page-title">Liên kết được bảo vệ</h1>
        <p class="description">
            Nhập mật khẩu để tiếp tục<span th:if="${linkTitle != null and !#strings.isEmpty(linkTitle)}"> đến <span class="link-title" th:text="${linkTitle}">liên kết</span></span>.
        </p>

        <form method="post" th:action="@{/r/{shortCode}/unlock(shortCode=${shortCode})}" th:object="${unlockRequest}">
            <div class="field">
                <label for="password">Mật khẩu</label>
                <input id="password"
                       type="password"
                       name="password"
                       th:attr="aria-invalid=${#fields.hasErrors('password')}"
                       aria-describedby="password-hint password-error"
                       autocomplete="current-password"
                       maxlength="128"
                       autofocus>
                <p class="field-hint" id="password-hint">Mật khẩu do người tạo liên kết cung cấp.</p>
                <p class="field-error" id="password-error" role="alert" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Mật khẩu không đúng</p>
            </div>
            <button class="button" type="submit">Mở liên kết</button>
        </form>

        <p class="footer-note">Mật khẩu được gửi trong nội dung biểu mẫu và không xuất hiện trên URL.</p>
    </section>
</main>
</body>
</html>
